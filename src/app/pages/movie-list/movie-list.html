<div class="container">
  @defer(on viewport) {
  @for (movie of movies; track movie.id) {
  <app-movie-card [movie]="movie" (deleteCard)="deleteCard($event)" />
  }
  @empty {
  <b>{{ 'MOVIELIST.EMPTY'| translate }}</b>
  }
  }
  @placeholder() {
  <b>{{ 'MOVIELIST.LOAD' | translate }}</b>
  }
  @loading (minimum 2s) {
  <mat-spinner></mat-spinner>
  }
  @error {
  <b>{{ 'MOVIELIST.ERROR' | translate }}</b>
  }
</div>
