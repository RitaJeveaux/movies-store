<div class="container">
  <form [formGroup]="loginForm" (ngSubmit)="submitForm()">
    <div>
      <mat-form-field>
        <mat-label>E-mail</mat-label>
        <input matInput formControlName="email" (input)="updateEmailErrorMessage()" (blur)="updateEmailErrorMessage()" placeholder="E-mail">

        @if (this.loginForm.controls["email"].invalid) {
        <mat-error>{{emailError}}</mat-error>
        }
      </mat-form-field>
    </div>
    <div>
      <mat-form-field class="password-field">
        <mat-label>Password</mat-label>

        <input matInput [type]="hide ? 'password' : 'text'" formControlName="password" placeholder="Password">

        <button mat-icon-button matSuffix type="button" (click)="toggleHide()" [attr.aria-label]="hide ? 'Mostrar senha' : 'Ocultar senha'">
          <mat-icon>{{ hide ? 'visibility_off' : 'visibility' }}</mat-icon>
        </button>

        @if (this.loginForm.get('password')?.hasError('required')) {
        <mat-error>{{passwordError}}</mat-error>
        }
      </mat-form-field>
    </div>
    <button mat-flat-button color="primary" class="send" [disabled]="this.loginForm.invalid">Enviar</button>
    <p><a mat-button [routerLink]="['/users/add']" class=" link">Log in or Register</a></p>
  </form>
</div>
