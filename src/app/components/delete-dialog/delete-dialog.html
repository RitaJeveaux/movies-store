<h2 mat-dialog-title>{{"DELETE_DIALOG.DELETE_MOVIE" | translate }}</h2>
<mat-dialog-content>{{"DELETE_DIALOG.MSG" | translate }} {{ data.title }}?</mat-dialog-content>
<mat-dialog-actions align="end">
  <button mat-button [mat-dialog-close]="false">{{"DELETE_DIALOG.CANCEL" | translate }}</button>
  <button mat-raised-button color="warn" [mat-dialog-close]="true">{{"DELETE_DIALOG.DELETE" | translate }}</button>
</mat-dialog-actions>
